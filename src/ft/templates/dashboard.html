<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Intra-Vision — 42 Warsaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* TV display: 1920x1080 @ 30Hz, viewed from across the room, no pointer.
     Patterned glass texture canvas + frosted liquid-glass panes.
     All motion is slow and transform-based (hardware-accelerated). */

  :root {
    /* ── Fallback canvas tint under the texture ───────────────────── */
    --canvas-fallback: #E6F4FA;

    /* ── Shared stage / 2-column rail (header + Page 1 console) ──── */
    --stage-inline: 2vw;
    --rail-pad: 2rem;
    --rail-gap: 1.5rem;
    --rail-2col: 3fr 1.4fr;

    /* ── Liquid glass widget panes ───────────────────────────────── */
    --shell-bg: rgba(255, 255, 255, 0.65);
    --shell-border: rgba(255, 255, 255, 0.82);

    /* ── Deep liquid / squircles radii ───────────────────────────── */
    --radius-console: max(48px, 4.2vw);
    --radius-pane: max(44px, 4.0vw);
    --radius-tile: max(30px, 2.8vw);
    --radius-chip: max(22px, 2.0vw);
    --radius-squircle: 38%;

    /* ── Typography on light backgrounds ──────────────────────────── */
    --title: #0f172a;
    --body: #1e293b;
    --dim: #64748b;
    --muted: #94a3b8;

    /* ── Gauge / data tracks ─────────────────────────────────────── */
    --track: rgba(209, 213, 219, 0.72);

    /* ── Accent palette for gauges & indicators ───────────────────── */
    --accent-blue: #0A84FF;
    --accent-yellow: #FFB300;
    --accent-green: #30D158;
    --accent-red: #FF453A;
    --accent-orange: #f97316;

    /* ── Soft float elevation — glass above textured background ─── */
    --float-glass: 0 10px 25px rgba(0, 0, 0, 0.08);

    /* ── Glass bevel + float (Students / Clusters / all .glass panes) */
    --glass-bevel:
      inset 1px 1px 0 rgba(255, 255, 255, 0.95),
      inset -1px -1px 0 rgba(0, 0, 0, 0.02),
      var(--float-glass);

    /* ── Floating title capsule shadow ────────────────────────────── */
    --title-float:
      inset 1px 1px 0 rgba(255, 255, 255, 0.90),
      var(--float-glass);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background-color: var(--canvas-fallback);
    background-image: url("/static/background-with-patterned-glass-texture.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--body);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.015em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    user-select: none;
  }

  /* Ambient blobs disabled — textured asset is the sole backplane */
  .ambient { display: none; }

  /* ── Layout chassis — transparent so pane frost sees the texture ─ */
  .console {
    background: transparent;
    border: none;
    border-radius: var(--radius-console);
    padding: var(--rail-pad);
    box-shadow: none;
    display: flex;
    gap: var(--rail-gap);
    flex: 1; height: 100%;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
  }

  /*
   * Shared 2-column rail — identical tracks for header pills AND
   * Page 1 cards so vertical gutters lock pixel-perfect.
   */
  .rail-2col {
    display: grid !important;
    grid-template-columns: var(--rail-2col);
    column-gap: var(--rail-gap);
    row-gap: var(--rail-gap);
    padding-left: var(--rail-pad);
    padding-right: var(--rail-pad);
    width: 100%;
    box-sizing: border-box;
  }

  /* ── Frosted glass widget panes — texture diffuse behind text ─── */
  .glass {
    position: relative;
    isolation: isolate;
    background: var(--shell-bg);
    backdrop-filter: blur(15px) saturate(140%);
    -webkit-backdrop-filter: blur(15px) saturate(140%);
    border: 1px solid var(--shell-border);
    box-shadow: var(--glass-bevel);
    border-radius: var(--radius-pane);
    transform: translate3d(0, 0, 0);
    transition: transform 700ms ease-out, box-shadow 700ms ease-out;
    overflow: hidden;
  }

  /* ── Floating Title Capsules with Independent Elevation Shadows ─ */
  .pill-header {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 999px;
    text-align: center;
    padding: 1.4vh 1.8vw;
    font-size: 2vh; font-weight: 800; color: #1e293b;
    letter-spacing: 0.02em; text-transform: uppercase;
    margin: 2.4vh 1.8vw 2.6vh;
    flex-shrink: 0;
    box-shadow: var(--title-float);
  }

  /* ── Dual liquid-glass header pills — same rail as Page 1 ────── */
  header.top-bar {
    position: fixed;
    top: 1.8vh;
    left: var(--stage-inline);
    right: var(--stage-inline);
    height: 6.8vh;
    z-index: 10;
    display: block;
    padding: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-radius: 0 !important;
    overflow: visible;
  }
  .top-bar-inner.rail-2col {
    height: 100%;
    padding-top: 0;
    padding-bottom: 0;
    align-items: stretch;
  }
  .header-pill {
    height: 100%;
    width: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(15px) saturate(140%);
    -webkit-backdrop-filter: blur(15px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.90),
      var(--float-glass);
    color: var(--title);
    box-sizing: border-box;
  }
  .header-brand {
    position: relative;
    justify-content: center;
    overflow: visible;
  }
  /* Outer lock — centering only, never animated */
  .logo-layout-anchor {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    height: auto;
    z-index: 10;
    pointer-events: none;
  }
  /* Inner glass bubble — float physics only */
  .brand-logo {
    width: 4.6vh;
    height: 4.6vh;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.45vh;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.55),
      var(--float-glass);
    will-change: transform;
    animation: elegantFloat 4s ease-in-out infinite;
  }
  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @keyframes elegantFloat {
    0%, 100% { transform: translateY(4px); }
    50%      { transform: translateY(-4px); }
  }
  .header-telemetry {
    justify-content: center;
    gap: 0;
    padding: 0 0.8vw;
  }
  .brand {
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #0F172A;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 1.2vw;
    background: none;
    -webkit-background-clip: unset;
    background-clip: unset;
    -webkit-text-fill-color: unset;
    filter: none;
  }
  .telemetry-item {
    font-size: 1.85vh;
    font-weight: 700;
    color: var(--body);
    letter-spacing: 0.02em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.45vw;
  }
  .telemetry-divider {
    width: 1px;
    height: 2.4vh;
    margin: 0 0.75vw;
    background: rgba(100, 116, 139, 0.35);
    flex-shrink: 0;
  }
  .telemetry-sync {
    font-weight: 700;
  }
  .telemetry-sync.stale {
    color: var(--accent-orange);
  }
  .sync-dot {
    width: 1.25vh;
    height: 1.25vh;
    border-radius: 50%;
    background: #22c55e;
    animation: syncPulse 3s ease-in-out infinite;
    flex-shrink: 0;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.55);
  }
  .sync-dot.off {
    background: var(--accent-orange);
    animation: none;
    box-shadow: 0 0 6px rgba(249, 115, 22, 0.45);
  }
  @keyframes syncPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.88); }
  }

  /* ── Main layout ─────────────────────────────────────────────── */
  main {
    position: relative; z-index: 1;
    height: 100%;
    padding: 10.5vh var(--stage-inline) 9.5vh;
    box-sizing: border-box;
  }
  .view {
    display: none; height: 100%;
    animation: viewFade 0.7s ease-out;
  }
  .view.active { display: flex; flex-direction: column; }
  @keyframes viewFade {
    from { opacity: 0; transform: translate3d(0, 1vh, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  /* ── Page 1: Active Students card ────────────────────────────── */
  .card-students {
    display: flex; flex-direction: column; overflow: hidden;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  .card-capacity {
    display: flex; flex-direction: column; overflow: hidden;
    min-width: 0;
    min-height: 0;
  }

  /* Absolute overflow-hidden mask — chassis never grows or clips. */
  .avatar-mask {
    position: absolute;
    top: 9.5vh; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    padding: 0 1.4vw 2vh;
  }
  .avatar-scroll {
    display: flex; flex-direction: column;
  }
  /* Seamless infinite vertical carousel — 45s GPU translateY loop. */
  .avatar-scroll.looping {
    animation: orbitalFlow 45s linear infinite;
    will-change: transform;
  }
  @keyframes orbitalFlow {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(0, -50%, 0); }
  }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 2.8vh 0.9vw;
    align-content: start;
    justify-content: start;
    justify-items: center;
    padding-bottom: 2.8vh;
  }
  .avatar-cell {
    display: flex; flex-direction: column; align-items: center;
    transition: transform 700ms ease-out, box-shadow 700ms ease-out;
    transform: translate3d(0, 0, 0);
    min-width: 0;
    width: 100%;
  }
  .avatar-frame {
    position: relative;
    padding: 0.65vh;
    border-radius: var(--radius-squircle);
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.70) 100%);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.95),
      inset -1px -1px 0 rgba(0, 0, 0, 0.04);
    transition: transform 700ms ease-out, box-shadow 700ms ease-out;
    transform: translate3d(0, 0, 0);
  }
  .avatar-wrap {
    position: relative; width: 16.5vh; height: 16.5vh;
    border-radius: var(--radius-squircle); overflow: hidden;
    transition: transform 700ms ease-out;
  }
  .avatar-wrap img {
    width: 100%; height: 100%; border-radius: var(--radius-squircle); object-fit: cover;
    background: var(--track);
    border: 2px solid rgba(255, 255, 255, 0.88);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
    display: block;
  }
  .avatar-name {
    font-size: 2.7vh; font-weight: 800; color: var(--title);
    letter-spacing: -0.02em; text-transform: lowercase;
    text-align: center; max-width: 100%;
    margin-top: 1.5vh;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── Page 1: Clusters Capacity 2x2 matrix ────────────────────── */
  .radial-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 2vh 1vw;
    padding: 0 1vw 2vh;
    flex: 1; align-content: center;
  }
  .radial-cell {
    display: flex; flex-direction: column; align-items: center;
  }
  .gauge-wrap {
    position: relative; width: 20vh; height: 20vh;
    border-radius: 42%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.70) 0%, rgba(255, 255, 255, 0.18) 55%, rgba(255, 255, 255, 0.08) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.70);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.85),
      var(--float-glass);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .radial-svg {
    width: 88%; height: 88%;
    transform: rotate(-90deg);
    filter: drop-shadow(0 2px 6px rgba(80, 90, 120, 0.12));
  }
  .radial-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 9.5;
    stroke-linecap: round;
    opacity: 0.85;
  }
  .radial-fill {
    fill: none;
    stroke-width: 9.5;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s ease-out;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.25));
  }
  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.3vh;
  }
  .gauge-label {
    font-size: 2.4vh; font-weight: 800; color: var(--title);
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .gauge-sub-fraction {
    font-size: 2.8vh;
    font-weight: 900;
    color: #64748B;
    letter-spacing: -0.02em;
    margin-top: 1.4vh;
    font-variant-numeric: tabular-nums;
  }

  .empty { font-size: 2.8vh; color: var(--dim); margin: auto; font-weight: 500; }

  /* ── Page 2: Column layout ────────────────────────────────────── */
  .fame-left {
    flex: 1.1;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .fame-center {
    flex: 1.2;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .fame-right {
    flex: 1.1;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Page 2: Recent Submissions — infinite vertical marquee ───── */
  .submissions-list {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 0 1.2vw 2vh;
    position: relative;
  }
  .submissions-track {
    display: flex;
    flex-direction: column;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    animation: submissionsMarquee 30s linear infinite;
  }
  .submissions-set {
    display: flex;
    flex-direction: column;
    gap: 1.6vh;
    padding-bottom: 1.6vh;
    flex-shrink: 0;
  }
  @keyframes submissionsMarquee {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(0, -50%, 0); }
  }
  /* FORCE translucent glass rows — beat any opaque cascade */
  .fame-left.glass,
  .fame-right.glass {
    background: rgba(255, 255, 255, 0.40) !important;
  }
  .sub-card,
  .zombie-row {
    background: rgba(255, 255, 255, 0.25) !important;
    backdrop-filter: blur(15px) saturate(140%) !important;
    -webkit-backdrop-filter: blur(15px) saturate(140%) !important;
    border: 1px solid rgba(255, 255, 255, 0.35) !important;
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.45),
      0 6px 16px rgba(70, 120, 160, 0.06) !important;
  }
  .sub-card {
    border-radius: var(--radius-tile);
    padding: 1.8vh 1.3vw;
    display: flex; align-items: center; gap: 1.1vw;
    transform: translate3d(0, 0, 0);
    flex-shrink: 0;
  }
  .sub-avatar {
    width: 10vh; height: 10vh; border-radius: var(--radius-squircle); object-fit: cover;
    background: var(--track); flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 4px 14px rgba(80, 90, 120, 0.16);
  }
  .sub-info {
    flex: 1; min-width: 0;
  }
  .sub-name {
    font-size: 2.6vh; font-weight: 700; color: var(--title);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .sub-detail {
    font-size: 1.8vh; color: var(--dim); margin-top: 0.5vh;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub-mark {
    font-size: 4vh; font-weight: 900; color: #059669;
    flex-shrink: 0; letter-spacing: -0.03em;
  }
  .sub-max {
    font-size: 2.2vh; font-weight: 500; color: var(--dim);
  }

  /* ── Page 2: Campus Telemetry — clean 2×2 with centered crosshair ─ */
  #metric-grid.metric-grid {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    grid-template-rows: 1fr 1fr !important;
    gap: 0 !important;
    flex: 1;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
    align-content: stretch !important;
    justify-content: stretch !important;
    align-items: stretch;
    padding: 2.5vh 2vw 3.5vh !important;
    position: relative;
  }
  /* Continuous crosshair — geometric center, never fragmented by cell gap */
  #metric-grid.metric-grid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 8%;
    bottom: 8%;
    width: 0;
    border-left: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 1px 0 0 rgba(71, 85, 105, 0.28);
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 1;
  }
  #metric-grid.metric-grid::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 8%;
    right: 8%;
    height: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 1px 0 rgba(71, 85, 105, 0.28);
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 1;
  }
  #metric-grid .metric-tile {
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 2.2vh 1.4vw !important;
    min-height: 0;
    text-align: center;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
  }
  #metric-grid .metric-tile .mt-value {
    font-size: 9.4vh;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.045em;
    margin: 0;
    background: linear-gradient(180deg, #0052D4 0%, #4364F7 48%, #6FB1FC 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.06));
  }
  #metric-grid .metric-tile .mt-label {
    font-size: max(0.75rem, 1.45vh);
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    max-width: 90%;
    line-height: 1.4;
  }

  /* ── Page 2: Sleepless Zombies leaderboard ─────────────────────── */
  .zombie-list {
    display: flex;
    flex-direction: column;
    gap: 1.5vh;
    flex: 1 1 auto;
    min-height: 0;
    justify-content: flex-start;
    padding: 0 1.2vw 20px;
    margin: 0 0 24px 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  .zombie-row {
    display: flex; align-items: center; gap: 1vw;
    padding: 1.5vh 1.2vw;
    border-radius: var(--radius-tile);
    transform: translate3d(0, 0, 0);
    flex-shrink: 0;
  }
  .zombie-rank {
    width: 5.5vh; height: 5.5vh; border-radius: var(--radius-squircle);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2vh; font-weight: 900; color: #ffffff;
    flex-shrink: 0;
    background: var(--accent-green);
    box-shadow: 0 4px 12px rgba(48, 209, 88, 0.25);
  }
  .zombie-rank.r1 { background: var(--accent-green); }
  .zombie-rank.r2 { background: #22c55e; }
  .zombie-rank.r3 { background: #4ade80; color: var(--title); }
  .zombie-rank.r4 { background: #86efac; color: var(--title); }
  .zombie-rank.r5 { background: #bbf7d0; color: var(--title); }
  .zombie-avatar {
    width: 8vh; height: 8vh; border-radius: var(--radius-squircle); object-fit: cover;
    background: var(--track); flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 4px 14px rgba(80, 90, 120, 0.16);
  }
  .zombie-name {
    font-size: 2.4vh; font-weight: 700; color: var(--title);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-left: 0.5vw;
  }
  .zombie-hours {
    font-size: 2.6vh; font-weight: 900; color: var(--dim);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ── Page 3: Column layout ────────────────────────────────────── */
  .analytics-left {
    flex: 1.3;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .analytics-right {
    flex: 1;
    display: flex; flex-direction: column; gap: 1.5vh; overflow: visible;
    background: none !important; border: none !important; box-shadow: none !important;
  }
  .analytics-right-top {
    flex: 1;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .analytics-right-bottom {
    flex: 1.2;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Page 3: Active projects — light glass L→R control capsules ─ */
  /* Symmetrical vertical fill: spectrum on top, pill grid stretches ~80%.
     Light frosted pills (bg-white/40) + slate-900 titles for TV glare.
     Thick left accent rails (w-4) clip cleanly inside rounded-full. */
  .projects-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    flex: 1;
    min-height: 0;
    padding: 2.5vh 2.2vw 3vh;
    gap: 2.5vh;
    box-sizing: border-box;
  }
  .spectrum-bar {
    width: 100%;
    height: 4vh;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.40);
    border: 1px solid rgba(255, 255, 255, 0.70);
    box-shadow:
      inset 0 2px 6px rgba(15, 23, 42, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.65),
      0 8px 20px rgba(80, 90, 120, 0.10);
  }
  .spectrum-segment {
    height: 100%;
    flex-shrink: 0;
    transition: width 700ms ease-out;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.40);
  }
  .spectrum-segment:first-child {
    border-radius: 999px 0 0 999px;
  }
  .spectrum-segment:last-child {
    border-radius: 0 999px 999px 0;
  }
  .spectrum-segment:only-child {
    border-radius: 999px;
  }
  /* grid-cols-2; flex 1 1 80% fills lower void with even row stretch */
  .project-pill-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-flow: row;
    grid-auto-rows: 1fr;
    gap: 1.8vh 1.6vw;
    width: 100%;
    flex: 1 1 80%;
    align-content: stretch;
    align-items: stretch;
    min-height: 0;
    margin-top: 0.5vh;
  }
  /* bg-white/40 backdrop-blur-md border-white/60 rounded-full shadow-sm */
  .project-pill {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    min-height: 7.2vh;
    padding: 0 1.5rem 0 0;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(15px) saturate(140%);
    -webkit-backdrop-filter: blur(15px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: var(--radius-tile);
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, 0.90),
      inset -1px -1px 0 rgba(0, 0, 0, 0.03),
      0 10px 24px rgba(70, 120, 160, 0.12),
      0 2px 6px rgba(70, 120, 160, 0.06);
    transition: transform 500ms ease-out, background 500ms ease-out, box-shadow 500ms ease-out;
    transform: translate3d(0, 0, 0);
  }
  /* w-4 h-full flex-shrink-0 — molds to curved left edge via overflow-hidden */
  .project-pill-rail {
    width: 1rem;
    flex-shrink: 0;
    align-self: stretch;
  }
  .project-pill-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1vw;
    flex: 1 1 auto;
    min-width: 0;
    padding: 1.6vh 0 1.6vh 0;
  }
  /* pl-4 text-slate-900 font-black — full names, never ellipsis */
  .project-pill-name {
    padding-left: 1rem;
    color: #0f172a;
    font-weight: 900;
    font-size: 2.25vh;
    letter-spacing: -0.025em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: visible;
    text-overflow: clip;
  }
  /* bg-slate-950/80 + text-emerald-400 font-mono font-black */
  .project-pill-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0.75vh 1.15vw;
    border-radius: 999px;
    background: rgba(2, 6, 23, 0.80);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 2vh;
    font-weight: 900;
    color: #34d399;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 2px 8px rgba(15, 23, 42, 0.18),
      0 0 12px rgba(52, 211, 153, 0.16);
  }

  /* ── Page 3: Evaluators — fixed weekly podium (TV, no filters) ── */
  .evaluators-grid {
    display: flex;
    gap: 1.4vw;
    padding: 0 1.6vw 2vh;
    flex: 1;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .evaluator-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    min-width: 0;
    max-width: 12vw;
    pointer-events: none;
  }
  .evaluator-avatar-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 10vh;
    height: 10vh;
    flex-shrink: 0;
  }
  .evaluator-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: var(--track);
    border: 3px solid rgba(255, 255, 255, 0.90);
    box-shadow: 0 4px 14px rgba(80, 90, 120, 0.18);
    display: block;
  }
  .evaluator-cell.rank-1 .evaluator-avatar {
    border-color: #f5d76e;
    box-shadow:
      0 0 0 3px rgba(245, 215, 110, 0.45),
      0 6px 18px rgba(180, 140, 40, 0.28);
  }
  .evaluator-cell.rank-2 .evaluator-avatar {
    border-color: #c0c7d1;
    box-shadow:
      0 0 0 3px rgba(192, 199, 209, 0.50),
      0 6px 16px rgba(100, 110, 130, 0.22);
  }
  .evaluator-cell.rank-3 .evaluator-avatar {
    border-color: #cd7f32;
    box-shadow:
      0 0 0 3px rgba(205, 127, 50, 0.40),
      0 6px 16px rgba(160, 90, 30, 0.22);
  }
  .evaluator-crown {
    position: absolute;
    top: -1.1vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.8vh;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.25));
    pointer-events: none;
    z-index: 2;
  }
  .evaluator-name {
    font-size: 2.0vh;
    font-weight: 700;
    color: var(--title);
    text-align: center;
    max-width: 100%;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.01em;
    margin-top: 1.2vh;
  }
  .evaluator-count {
    font-size: 2.8vh;
    font-weight: 900;
    color: var(--accent-blue);
    margin-top: 0.5vh;
  }
  .evaluator-count-label {
    font-size: 1.25vh;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #64748b;
    margin-top: 0.15vh;
  }
  .evaluator-rank-label {
    font-size: 1.3vh;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-top: 0.3vh;
  }
  .evaluator-cell.rank-1 .evaluator-rank-label { color: #b45309; }
  .evaluator-cell.rank-2 .evaluator-rank-label { color: #64748b; }
  .evaluator-cell.rank-3 .evaluator-rank-label { color: #9a3412; }

  /* ── Page 3: Weekly logtime — full-width rose bars ─────────────── */
  /* flex flex-row items-end justify-between w-full; precomputed height_pct */
  .logtime-chart {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
    width: 100%;
    flex: 1;
    min-height: 22vh;
    padding: 1.5vh 1.5vw 2vh;
    gap: 0.6vw;
    box-sizing: border-box;
  }
  .logtime-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    height: 100%;
    min-width: 0;
  }
  .logtime-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.7vh;
    font-weight: 900;
    color: #0f172a;
    text-align: center;
    margin-bottom: 0.8vh;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .logtime-bar {
    width: 55%;
    max-width: 2.6vw;
    min-width: 1.4vw;
    border-radius: 1.1rem 1.1rem 0.55rem 0.55rem;
    background: linear-gradient(180deg, #fb7185 0%, #f43f5e 55%, #e11d48 100%);
    box-shadow: 0 0 15px rgba(244, 63, 94, 0.40);
    /* transition-all duration-1000 ease-out — slow rise for 30Hz TV */
    transition: height 1000ms ease-out, box-shadow 1000ms ease-out;
    min-height: 4px;
    transform: translate3d(0, 0, 0);
  }
  .logtime-day {
    font-size: 1.85vh;
    font-weight: 900;
    color: #0f172a;
    margin-top: 1.2vh;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }

  /* ── Floating glass footer — no edge-mask clipping ───────────── */
  footer {
    position: fixed; bottom: 1.8vh; left: 2vw; right: 2vw;
    height: 5.8vh;
    display: flex;
    align-items: center;
    justify-content: stretch;
    padding: 0 3.2vw;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(15px) saturate(140%);
    -webkit-backdrop-filter: blur(15px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.90),
      var(--float-glass);
    overflow: hidden;
    z-index: 10;
    /* Explicitly kill any prior edge masks that chopped copy */
    -webkit-mask-image: none !important;
    mask-image: none !important;
  }
  .footer-viewport {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .marquee-track {
    display: flex;
    flex-direction: row;
    align-items: center;
    width: max-content;
    height: 100%;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    animation: footerMarquee 55s linear infinite;
  }
  .marquee-set {
    display: flex;
    flex-direction: row;
    align-items: center;
    flex-shrink: 0;
    height: 100%;
  }
  .marquee-text {
    display: inline-flex;
    align-items: center;
    height: 100%;
    font-size: 2vh;
    font-weight: 500;
    color: var(--dim);
    padding: 0 3.2vw;
    font-style: italic;
    line-height: 1.2;
    white-space: nowrap;
  }
  @keyframes footerMarquee {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }

  /* ── Progress dots ───────────────────────────────────────────── */
  .dots {
    position: fixed; bottom: 8.8vh; left: 0; right: 0;
    display: flex; justify-content: center; gap: 1vw; z-index: 10;
  }
  .dot {
    width: 1vh; height: 1vh; border-radius: 50%;
    background: rgba(100, 116, 139, 0.30);
    transition: all 700ms ease-out;
  }
  .dot.on {
    background: var(--accent-blue);
    box-shadow: 0 0 8px rgba(10, 132, 255, 0.45);
    transform: scale(1.3);
  }
</style>
</head>
<body>

<!-- Atmospheric depth glow behind the console -->
<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- ── Dual glass header pills — widths match Page 1 columns ──── -->
<header class="top-bar">
  <div class="top-bar-inner rail-2col">
    <div class="header-pill header-brand">
      <div class="logo-layout-anchor">
        <div class="brand-logo" aria-hidden="true">
          <img src="/static/42-logo.svg" alt="" width="48" height="48">
        </div>
      </div>
      <div class="brand">INTRAVISION</div>
    </div>
    <div class="header-pill header-telemetry" id="header-telemetry">
      <span class="telemetry-item" id="weather-temp">—°C</span>
      <span class="telemetry-divider" aria-hidden="true"></span>
      <span class="telemetry-item" id="weather-city">Warsaw</span>
      <span class="telemetry-divider" aria-hidden="true"></span>
      <span class="telemetry-item" id="live-clock">--:--</span>
      <span class="telemetry-divider" aria-hidden="true"></span>
      <span class="telemetry-item telemetry-sync" id="sync-status">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="stamp">Synced (—)</span>
      </span>
    </div>
  </div>
</header>

<!-- ── Main content views ─────────────────────────────────────── -->
<main>

  <!-- View 1 — Page 1: Active Students + Clusters Capacity -->
  <section class="view active" data-view="validations">
    <div class="console rail-2col">
      <div class="card-students glass">
        <div class="pill-header">Current Active Students (<span id="active-count">0</span>)</div>
        <div class="avatar-mask" id="avatar-grid"></div>
      </div>
      <div class="card-capacity glass">
        <div class="pill-header">Clusters Capacity</div>
        <div class="radial-grid" id="radials"></div>
      </div>
    </div>
  </section>

  <!-- View 2 — Page 2: Hall of Fame & Telemetry -->
  <section class="view" data-view="fame">
    <div class="console">
      <div class="fame-left glass">
        <div class="pill-header">Recent Submissions</div>
        <div class="submissions-list" id="submissions"></div>
      </div>
      <div class="fame-center glass">
        <div class="pill-header">Campus Telemetry</div>
        <div class="metric-grid" id="metric-grid"></div>
      </div>
      <div class="fame-right glass">
        <div class="pill-header">Top Sleepless Zombies</div>
        <div class="zombie-list" id="zombies"></div>
      </div>
    </div>
  </section>

  <!-- View 3 — Page 3: Projects & Peer Analytics -->
  <section class="view" data-view="analytics">
    <div class="console">
      <div class="analytics-left glass">
        <div class="pill-header">Current Active Projects</div>
        <div class="projects-panel" id="projects-panel"></div>
      </div>
      <div class="analytics-right">
        <div class="analytics-right-top glass">
          <div class="pill-header">Evaluations Given</div>
          <div class="evaluators-grid" id="evaluators"></div>
        </div>
        <div class="analytics-right-bottom glass">
          <div class="pill-header">Weekly Cadet Log-in Hours</div>
          <div class="logtime-chart" id="logtime"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ── Progress dots ──────────────────────────────────────────── -->
<div class="dots" id="dots"></div>

<!-- ── Floating glass footer — daily vault, slide-synced ───────── -->
<footer>
  <div class="footer-viewport">
    <div class="marquee-track" id="marquee"></div>
  </div>
</footer>

<script type="application/json" id="boot-metrics">{{ metrics | tojson }}</script>
<script type="application/json" id="boot-refresh">{{ (last_refresh or "") | tojson }}</script>
<script>
  const INITIAL = JSON.parse(document.getElementById('boot-metrics').textContent);
  const LAST_REFRESH = JSON.parse(document.getElementById('boot-refresh').textContent);

  const DWELL = { validations: 30000, fame: 25000, analytics: 25000 };
  const POLL_MS = 30000;
  const STALE_MS = 30 * 60 * 1000;

  /* ── Footer message vault — daily deterministic rotation ─────── */
  const FOOTER_VAULT = {
    appreciation: [
      "With sincere thanks from the students — to the Bocal and building staff for caring for our campus every day. 💙",
      "Z serdecznymi podziękowaniami od studentów — dla Bocala i personelu budynku za codzienną troskę o nasz kampus. 💙",
      "We gratefully acknowledge the Bocal and facility team, whose quiet work keeps 42 Warsaw welcoming and orderly. 🌿",
      "Z wdzięcznością dziękujemy Bocalowi i zespołowi obsługi — Wasza cicha praca sprawia, że 42 Warsaw jest przyjazne i zadbane. 🌿",
      "Respectful thanks to the Bocal and campus staff for the care you give our spaces, and to our community. 🙌",
      "Z szacunkiem dziękujemy Bocalowi i pracownikom kampusu za troskę o nasze przestrzenie i o naszą społeczność. 🙌",
      "The students of 42 Warsaw offer warm gratitude to the Bocal and maintenance crew for your steadfast service. 🚀",
      "Studenci 42 Warsaw składają ciepłe podziękowania Bocalowi oraz ekipie utrzymania za Waszą niezawodną służbę. 🚀",
    ],
    quotes: [
      "It does not matter how slowly you go as long as you do not stop. — Confucius",
      "Grit is sticking with your future, day in, day out—not just for the week, but for years, to make that future a reality. — Angela Duckworth",
      "Our greatest weakness lies in giving up. The most certain way to succeed is always to try just one more time. — Thomas Edison",
      "The only limit to our realization of tomorrow will be our doubts of today. — Franklin D. Roosevelt",
      "Quality is not an act, it is a habit. Excellence is achieved through consistency, not coincidence. — Aristotle",
    ],
    facts: [
      "Did you know? The first computer bug was a real moth trapped inside a Harvard Mark II relay in 1947, discovered by Grace Hopper.",
      "Did you know? The first electronic computer, ENIAC, weighed over 27 tons and took up an entire 1,800 square foot room.",
      "Did you know? The original concept of the internet was called ARPANET, created by the US Department of Defense in the late 1960s.",
      "Did you know? The C programming language was created at Bell Labs between 1972 and 1973 to rewrite the Unix operating system.",
    ],
  };

  /** Warsaw-local day-of-year (1–366). Stable across midnight local, not UTC. */
  function warsawDayOfYear(now = new Date()) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Europe/Warsaw',
      year: 'numeric',
      month: 'numeric',
      day: 'numeric',
    }).formatToParts(now);
    const get = (t) => Number(parts.find((p) => p.type === t).value);
    const y = get('year');
    const m = get('month');
    const d = get('day');
    const start = Date.UTC(y, 0, 0);
    const today = Date.UTC(y, m - 1, d);
    return Math.floor((today - start) / 86400000);
  }

  function pickDaily(messages, dayIndex, salt = 0) {
    if (!messages || !messages.length) return '';
    return messages[(dayIndex + salt) % messages.length];
  }

  /** Slide 0 → daily EN+PL appreciation pair; 1 → quotes; 2 → facts. */
  function dailyFooterMessages(slideIndex) {
    const day = warsawDayOfYear();
    if (slideIndex === 0) {
      const pair = (day % 4) * 2;
      return [
        FOOTER_VAULT.appreciation[pair],
        FOOTER_VAULT.appreciation[pair + 1],
      ];
    }
    if (slideIndex === 1) return [pickDaily(FOOTER_VAULT.quotes, day, 1)];
    return [pickDaily(FOOTER_VAULT.facts, day, 2)];
  }

  function renderFooterForSlide(slideIndex) {
    const track = document.getElementById('marquee');
    if (!track) return;
    const parts = dailyFooterMessages(slideIndex).filter(Boolean);
    const spans = parts.map((t) => `<span class="marquee-text">${esc(t)}</span>`).join('');
    track.style.animation = 'none';
    track.innerHTML = `
      <div class="marquee-set">${spans}</div>
      <div class="marquee-set" aria-hidden="true">${spans}</div>`;
    void track.offsetWidth;
    track.style.animation = '';
  }

  const RADIAL_R = 40;
  const RADIAL_CIRC = 251.2;
  // Fallback cluster display if metrics.cluster_capacity is empty (no data yet).
  const CLUSTER_FALLBACK = [
    { key: 'Total', value: 0, max: 1, color: '#0A84FF' },
    { key: 'C1', value: 0, max: 1, color: '#FFB300' },
    { key: 'C2', value: 0, max: 1, color: '#30D158' },
    { key: 'C3', value: 0, max: 1, color: '#FF453A' },
  ];

  // Above this count the avatar grid switches to the infinite orbital loop.
  const ORBITAL_THRESHOLD = 8;

  const views = [...document.querySelectorAll('.view')];
  let index = 0;
  let latestRefresh = LAST_REFRESH;

  function ago(seconds) {
    if (seconds < 60) return 'just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
    return Math.floor(seconds / 86400) + 'd ago';
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ── Page 1: Avatar orbital flow (full locations list) ────────── */
  function avatarCell(u) {
    const login = u.login || '?';
    const initial = (login[0] || '?').toUpperCase();
    const img = u.image
      ? `<img src="${esc(u.image)}" alt="${esc(login)}" loading="lazy">`
      : `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect fill='%23D1D5DB' width='96' height='96'/%3E%3Ctext x='48' y='58' text-anchor='middle' fill='%2364748b' font-size='34' font-family='system-ui' font-weight='700'%3E${esc(initial)}%3C/text%3E%3C/svg%3E" alt="${esc(login)}">`;
    return `
      <div class="avatar-cell">
        <div class="avatar-frame">
          <div class="avatar-wrap">${img}</div>
        </div>
        <div class="avatar-name">${esc(login)}</div>
      </div>`;
  }

  function renderAvatarGrid(cadets) {
    const el = document.getElementById('avatar-grid');
    const countEl = document.getElementById('active-count');
    const list = Array.isArray(cadets) ? cadets : [];
    countEl.textContent = list.length;

    if (!list.length) {
      el.innerHTML = '<div class="empty">Nobody on campus right now.</div>';
      return;
    }

    // Full locations payload — do not truncate the source array.
    const cells = list.map((u) => avatarCell(u)).join('');

    if (list.length > ORBITAL_THRESHOLD) {
      el.innerHTML = `
        <div class="avatar-scroll looping">
          <div class="avatar-grid">${cells}</div>
          <div class="avatar-grid" aria-hidden="true">${cells}</div>
        </div>`;
    } else {
      el.innerHTML = `<div class="avatar-scroll"><div class="avatar-grid">${cells}</div></div>`;
    }
  }

  /* ── Page 1: Clusters Capacity gauges (r=40, circ≈251.2) ───── */
  function renderRadials(clusters) {
    const el = document.getElementById('radials');
    const rows = (clusters && clusters.length) ? clusters : CLUSTER_FALLBACK;
    el.innerHTML = rows.map(cfg => {
      const val = cfg.value || 0;
      const max = cfg.max || 1;
      const pct = Math.min(val / max, 1);
      const offset = RADIAL_CIRC * (1 - pct);
      return `
      <div class="radial-cell">
        <div class="gauge-wrap">
          <svg class="radial-svg" viewBox="0 0 100 100">
            <circle class="radial-track" cx="50" cy="50" r="${RADIAL_R}"/>
            <circle class="radial-fill" cx="50" cy="50" r="${RADIAL_R}"
              stroke="${esc(cfg.color)}"
              stroke-dasharray="${RADIAL_CIRC}"
              stroke-dashoffset="${offset}"/>
          </svg>
          <div class="gauge-center">
            <span class="gauge-label">${esc(cfg.key)}</span>
          </div>
        </div>
        <div class="gauge-sub-fraction">${val}/${max}</div>
      </div>`;
    }).join('');
  }

  /* Forced inline glass — survives any stylesheet race */
  const GLASS_ROW_STYLE = [
    'background:rgba(255,255,255,0.25) !important',
    'border:1px solid rgba(255,255,255,0.35) !important',
    'backdrop-filter:blur(15px) saturate(140%)',
    '-webkit-backdrop-filter:blur(15px) saturate(140%)',
  ].join(';');

  /* ── Page 2: Recent submissions — duplicated track marquee ──── */
  function renderSubmissions(rows) {
    const el = document.getElementById('submissions');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No recent submissions.</div>';
      return;
    }
    const feed = rows.slice(0, 10);
    const cards = feed.map(r => {
      const login = r.user.login || '?';
      const initial = (login[0] || '?').toUpperCase();
      const avatarImg = r.user.image
        ? `<img class="sub-avatar" src="${esc(r.user.image)}" alt="${esc(login)}" loading="lazy">`
        : `<img class="sub-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect fill='%23D1D5DB' width='96' height='96'/%3E%3Ctext x='48' y='58' text-anchor='middle' fill='%2364748b' font-size='34' font-family='system-ui' font-weight='700'%3E${esc(initial)}%3C/text%3E%3C/svg%3E" alt="${esc(login)}">`;
      return `
      <div class="sub-card" style="${GLASS_ROW_STYLE}">
        ${avatarImg}
        <div class="sub-info">
          <div class="sub-name">${esc(login)}</div>
          <div class="sub-detail">${esc(r.project)} · ${ago(r.age_seconds)}</div>
        </div>
        <div class="sub-mark">${r.mark ?? '—'}<span class="sub-max"> / 100</span></div>
      </div>`;
    }).join('');

    // Duplicate the set so translateY(-50%) loops with no blank flash.
    el.innerHTML = `
      <div class="submissions-track" aria-hidden="false">
        <div class="submissions-set">${cards}</div>
        <div class="submissions-set" aria-hidden="true">${cards}</div>
      </div>`;
  }

  /* ── Page 2: Metric grid — clean tiles; crosshair is CSS ::before/::after ─ */
  function renderMetricGrid(metrics) {
    const cells = [
      ['Average Milestone', metrics.average_milestone || 0],
      ['Average Login', (metrics.average_session || 0) + 'h'],
      ['Total Weekly Passed', metrics.weekly_passes || 0],
      ['Total Peer Evaluation', metrics.evals_completed || 0],
    ];
    document.getElementById('metric-grid').innerHTML = cells.map(([label, val]) => `
      <div class="metric-tile">
        <div class="mt-value">${esc(val)}</div>
        <div class="mt-label">${esc(label)}</div>
      </div>`).join('');
  }

  /* ── Page 2: Sleepless zombies ──────────────────────────────── */
  function renderZombies(rows) {
    const el = document.getElementById('zombies');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No logtime data yet.</div>';
      return;
    }
    el.innerHTML = rows.slice(0, 5).map(z => {
      const login = z.user.login || '?';
      const initial = (login[0] || '?').toUpperCase();
      const avatarImg = z.user.image
        ? `<img class="zombie-avatar" src="${esc(z.user.image)}" alt="${esc(login)}" loading="lazy">`
        : `<img class="zombie-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect fill='%23D1D5DB' width='96' height='96'/%3E%3Ctext x='48' y='58' text-anchor='middle' fill='%2364748b' font-size='34' font-family='system-ui' font-weight='700'%3E${esc(initial)}%3C/text%3E%3C/svg%3E" alt="${esc(login)}">`;
      return `
      <div class="zombie-row" style="${GLASS_ROW_STYLE}">
        <div class="zombie-rank r${z.rank}">${z.rank}</div>
        ${avatarImg}
        <div class="zombie-name">${esc(login)}</div>
        <div class="zombie-hours">${z.hours}h</div>
      </div>`;
    }).join('');
  }

  /* ── Page 3: Spectrum bar + L→R pill rails (same data order) ─── */
  function renderActiveProjects(rows) {
    const el = document.getElementById('projects-panel');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No active projects.</div>';
      return;
    }

    const total = rows.reduce((sum, r) => sum + (r.count || 0), 0) || 1;

    const segments = rows.map(r => {
      const widthPct = ((r.count || 0) / total) * 100;
      return `<div class="spectrum-segment"
        style="width:${widthPct}%;background:${esc(r.color)};"
        title="${esc(r.name)} · ${esc(r.percentage)}"></div>`;
    }).join('');

    const pills = rows.map(r => `
      <div class="project-pill">
        <div class="project-pill-rail" style="background:${esc(r.color)}"></div>
        <div class="project-pill-body">
          <span class="project-pill-name">${esc(r.name)}</span>
          <span class="project-pill-badge">${esc(r.percentage)}</span>
        </div>
      </div>`).join('');

    el.innerHTML = `
      <div class="spectrum-bar" aria-label="Active projects spectrum">${segments}</div>
      <div class="project-pill-grid">${pills}</div>`;
  }

  /* ── Page 3: Top evaluators — fixed weekly podium ───────────── */
  function renderEvaluators(rows) {
    const el = document.getElementById('evaluators');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No evaluations given this week.</div>';
      return;
    }

    el.innerHTML = rows.map((e) => {
      const login = e.login || (e.user && e.user.login) || '?';
      const rank = Number(e.rank) || 0;
      const count = e.count || 0;
      const avatarUrl = e.avatar_url || (e.user && e.user.image) || '';
      const initial = (login[0] || '?').toUpperCase();
      const rankClass = rank >= 1 && rank <= 3 ? ` rank-${rank}` : '';
      const crown = rank === 1
        ? '<span class="evaluator-crown" aria-hidden="true">♛</span>'
        : '';
      const avatarImg = avatarUrl
        ? `<img class="evaluator-avatar" src="${esc(avatarUrl)}" alt="${esc(login)}" loading="lazy">`
        : `<img class="evaluator-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect fill='%23D1D5DB' width='96' height='96'/%3E%3Ctext x='48' y='58' text-anchor='middle' fill='%2364748b' font-size='34' font-family='system-ui' font-weight='700'%3E${esc(initial)}%3C/text%3E%3C/svg%3E" alt="${esc(login)}">`;

      return `
      <div class="evaluator-cell${rankClass}">
        <div class="evaluator-avatar-wrap">
          ${crown}
          ${avatarImg}
        </div>
        <div class="evaluator-name">${esc(login)}</div>
        <div class="evaluator-count">${count}</div>
        <div class="evaluator-count-label">given</div>
        <div class="evaluator-rank-label">#${rank || '—'}</div>
      </div>`;
    }).join('');
  }

  /* ── Page 3: Weekly logtime bars — precomputed height_pct ───── */
  function renderLogtime(rows) {
    const el = document.getElementById('logtime');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No logtime data.</div>';
      return;
    }
    el.innerHTML = rows.map(r => {
      const pct = Math.max(0, Math.min(100, Number(r.height_pct) || 0));
      const hoursLabel = (r.hours > 0) ? `${r.hours}h` : '0h';
      const dayLabel = String(r.day || '').toUpperCase();
      return `
      <div class="logtime-bar-wrap">
        <div class="logtime-val">${esc(hoursLabel)}</div>
        <div class="logtime-bar" style="height:${pct}%"></div>
        <div class="logtime-day">${esc(dayLabel)}</div>
      </div>`;
    }).join('');
  }

  /* ── Header telemetry: weather / clock / sync age ───────────── */
  function formatClock(d) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function renderClock() {
    const el = document.getElementById('live-clock');
    if (el) el.textContent = formatClock(new Date());
  }

  function formatSyncAge(seconds) {
    if (seconds < 60) return seconds + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
    return Math.floor(seconds / 3600) + 'h';
  }

  function renderStamp(iso) {
    const el = document.getElementById('stamp');
    const dot = document.getElementById('sync-dot');
    const wrap = document.getElementById('sync-status');
    if (!el || !dot) return;
    if (!iso) {
      el.textContent = 'No data';
      wrap && wrap.classList.add('stale');
      dot.classList.add('off');
      return;
    }
    const ageSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    const stale = ageSec * 1000 > STALE_MS;
    el.textContent = 'Synced (' + formatSyncAge(ageSec) + ')';
    wrap && wrap.classList.toggle('stale', stale);
    dot.classList.toggle('off', stale);
  }

  async function fetchWeather() {
    const tempEl = document.getElementById('weather-temp');
    const cityEl = document.getElementById('weather-city');
    try {
      const res = await fetch('/api/weather', { cache: 'no-store' });
      const data = await res.json();
      if (tempEl) tempEl.textContent = data.label || '—°C';
      if (cityEl) cityEl.textContent = data.city || 'Warsaw';
    } catch (e) {
      console.warn('weather failed', e);
      if (tempEl) tempEl.textContent = '—°C';
    }
  }

  /* ── Orchestrator ───────────────────────────────────────────── */
  function render(metrics, lastRefresh) {
    const validations = metrics.recent_validations || [];

    renderAvatarGrid(metrics.active_on_campus || []);
    renderRadials(metrics.cluster_capacity || []);
    renderSubmissions(validations);
    renderMetricGrid(metrics);
    renderZombies(metrics.zombies || []);
    renderActiveProjects(metrics.active_project_data || []);
    renderEvaluators(metrics.top_evaluators || []);
    renderLogtime(metrics.weekly_logtime_data || []);

    if (lastRefresh) latestRefresh = lastRefresh;
    renderStamp(latestRefresh);
  }

  function renderDots() {
    document.getElementById('dots').innerHTML =
      views.map((_, i) => `<div class="dot ${i === index ? 'on' : ''}"></div>`).join('');
  }

  function advance() {
    views[index].classList.remove('active');
    index = (index + 1) % views.length;
    views[index].classList.add('active');
    renderDots();
    renderFooterForSlide(index);
    setTimeout(advance, DWELL[views[index].dataset.view] || 20000);
  }

  async function poll() {
    try {
      const res = await fetch('/api/metrics', { cache: 'no-store' });
      const data = await res.json();
      render(data.metrics, data.last_refresh);
    } catch (e) {
      console.warn('poll failed', e);
    }
  }

  render(INITIAL, LAST_REFRESH);
  renderDots();
  renderFooterForSlide(0);
  renderClock();
  fetchWeather();
  setTimeout(advance, DWELL[views[0].dataset.view]);
  setInterval(poll, POLL_MS);
  setInterval(() => renderStamp(latestRefresh), 1000);
  // Align clock ticks to the wall-clock minute boundary.
  (function scheduleClock() {
    const now = new Date();
    const wait = ((60 - now.getSeconds()) * 1000) - now.getMilliseconds();
    setTimeout(() => {
      renderClock();
      setInterval(renderClock, 60000);
    }, Math.max(wait, 0));
  })();
  setInterval(fetchWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
